<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="emBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0D1220" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <pattern id="emGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(148, 163, 184, 0.08)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="600" height="360" fill="url(#emBg)" />
  <rect width="600" height="360" fill="url(#emGrid)" />

  <circle cx="200" cy="160" r="110" fill="#6366F1" fill-opacity="0.1" filter="blur(35px)" />
  <circle cx="400" cy="180" r="90" fill="#A855F7" fill-opacity="0.12" filter="blur(35px)" />

  <!-- Computer Vision Facial Boundary Box -->
  <g transform="translate(60, 50)">
    <!-- Bounding Box Corners -->
    <path d="M 40 40 L 40 10 L 70 10" fill="none" stroke="#A855F7" stroke-width="3" stroke-linecap="round" />
    <path d="M 200 10 L 230 10 L 230 40" fill="none" stroke="#A855F7" stroke-width="3" stroke-linecap="round" />
    <path d="M 40 180 L 40 210 L 70 210" fill="none" stroke="#A855F7" stroke-width="3" stroke-linecap="round" />
    <path d="M 200 210 L 230 210 L 230 180" fill="none" stroke="#A855F7" stroke-width="3" stroke-linecap="round" />

    <!-- Face Landmarks Silhouette -->
    <circle cx="135" cy="110" r="50" fill="none" stroke="rgba(148, 163, 184, 0.3)" stroke-width="1.5" stroke-dasharray="4 4" />
    <!-- Eyes -->
    <ellipse cx="115" cy="95" rx="8" ry="4" fill="#38BDF8" />
    <ellipse cx="155" cy="95" rx="8" ry="4" fill="#38BDF8" />
    <!-- Smile Curve -->
    <path d="M 115 130 Q 135 145 155 130" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" />

    <!-- Landmark Points -->
    <circle cx="135" cy="110" r="3" fill="#A855F7" />
    <circle cx="115" cy="130" r="2.5" fill="#10B981" />
    <circle cx="155" cy="130" r="2.5" fill="#10B981" />
    <circle cx="135" cy="140" r="2.5" fill="#10B981" />
  </g>

  <!-- Real-Time Classification Graph Panel -->
  <g transform="translate(320, 60)">
    <rect width="240" height="190" rx="12" fill="#0D1220" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />
    <text x="16" y="28" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">CONFIDENCE PROBABILITY</text>
    
    <!-- Happy Bar -->
    <text x="16" y="58" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Happy</text>
    <text x="195" y="58" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11">96.8%</text>
    <rect x="16" y="66" width="208" height="6" rx="3" fill="#1E293B" />
    <rect x="16" y="66" width="201" height="6" rx="3" fill="#10B981" />

    <!-- Neutral Bar -->
    <text x="16" y="98" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Neutral</text>
    <text x="202" y="98" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">2.4%</text>
    <rect x="16" y="106" width="208" height="6" rx="3" fill="#1E293B" />
    <rect x="16" y="106" width="10" height="6" rx="3" fill="#6366F1" />

    <!-- Surprise Bar -->
    <text x="16" y="138" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Surprised</text>
    <text x="202" y="138" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">0.8%</text>
    <rect x="16" y="146" width="208" height="6" rx="3" fill="#1E293B" />
    <rect x="16" y="146" width="5" height="6" rx="3" fill="#A855F7" />

    <text x="16" y="174" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9">FPS: 30 &bull; MODEL: CNN &bull; OPENCV</text>
  </g>

  <!-- Title Pill -->
  <g transform="translate(30, 290)">
    <rect width="240" height="38" rx="19" fill="#070B14" stroke="url(#purpleGrad)" stroke-width="1.5" />
    <text x="120" y="24" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      Emotion Detection &bull; OpenCV &bull; TF
    </text>
  </g>
</svg>
