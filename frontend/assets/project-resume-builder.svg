<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="resBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0D1220" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <pattern id="resGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(148, 163, 184, 0.08)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="600" height="360" fill="url(#resBg)" />
  <rect width="600" height="360" fill="url(#resGrid)" />

  <circle cx="300" cy="180" r="130" fill="#A855F7" fill-opacity="0.12" filter="blur(40px)" />

  <!-- Document Wireframe with AI Suggestions -->
  <g transform="translate(60, 40)">
    <!-- Document Card -->
    <rect x="20" y="10" width="220" height="230" rx="12" fill="#111827" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1.5" />
    
    <!-- Header Lines -->
    <rect x="40" y="30" width="100" height="12" rx="3" fill="#F8FAFC" />
    <rect x="40" y="48" width="140" height="6" rx="2" fill="#94A3B8" />

    <!-- Divider -->
    <line x1="40" y1="65" x2="220" y2="65" stroke="#1E293B" stroke-width="1.5" />

    <!-- Experience Bullet Lines -->
    <rect x="40" y="80" width="80" height="8" rx="2" fill="#6366F1" />
    <rect x="40" y="96" width="170" height="5" rx="2" fill="#64748B" />
    <rect x="40" y="108" width="150" height="5" rx="2" fill="#64748B" />
    <rect x="40" y="120" width="160" height="5" rx="2" fill="#64748B" />

    <!-- Skills section -->
    <rect x="40" y="140" width="60" height="8" rx="2" fill="#A855F7" />
    <rect x="40" y="156" width="50" height="14" rx="4" fill="#1E293B" />
    <rect x="96" y="156" width="45" height="14" rx="4" fill="#1E293B" />
    <rect x="147" y="156" width="55" height="14" rx="4" fill="#1E293B" />

    <!-- ATS Check Badge -->
    <g transform="translate(140, 190)">
      <rect width="90" height="28" rx="14" fill="#070B14" stroke="#10B981" stroke-width="1.5" />
      <text x="45" y="18" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">ATS: 96/100</text>
    </g>
  </g>

  <!-- NLP Suggestion Engine Card -->
  <g transform="translate(320, 50)">
    <rect width="240" height="200" rx="12" fill="#0D1220" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />
    <text x="16" y="28" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">AI NLP KEYWORD OPTIMIZER</text>

    <!-- Suggestion Box -->
    <rect x="16" y="44" width="208" height="60" rx="8" fill="#111827" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1" />
    <text x="26" y="64" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">&#9733; Recommended Action Verb:</text>
    <text x="26" y="82" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">"Engineered ETL pipelines with 40% latency reduction"</text>

    <!-- Keyword Cloud -->
    <text x="16" y="130" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Extracted Domain Skills:</text>
    <g transform="translate(16, 142)">
      <rect x="0" y="0" width="60" height="22" rx="11" fill="rgba(99, 102, 241, 0.2)" stroke="#6366F1" stroke-width="1" />
      <text x="30" y="14" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">PyTorch</text>

      <rect x="66" y="0" width="55" height="22" rx="11" fill="rgba(168, 85, 247, 0.2)" stroke="#A855F7" stroke-width="1" />
      <text x="93" y="14" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Flask</text>

      <rect x="127" y="0" width="65" height="22" rx="11" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981" stroke-width="1" />
      <text x="159" y="14" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Spacy NLP</text>
    </g>
  </g>

  <!-- Title Pill -->
  <g transform="translate(30, 290)">
    <rect width="250" height="38" rx="19" fill="#070B14" stroke="url(#purpleGrad)" stroke-width="1.5" />
    <text x="125" y="24" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      AI Resume Builder &bull; NLP &bull; Flask
    </text>
  </g>
</svg>
