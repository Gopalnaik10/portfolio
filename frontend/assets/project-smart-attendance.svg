<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="attBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0D1220" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <pattern id="attGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(148, 163, 184, 0.08)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="600" height="360" fill="url(#attBg)" />
  <rect width="600" height="360" fill="url(#attGrid)" />

  <circle cx="280" cy="160" r="120" fill="#6366F1" fill-opacity="0.12" filter="blur(40px)" />

  <!-- Biometric Face Scan Grid -->
  <g transform="translate(60, 40)">
    <!-- Recognition Mesh -->
    <rect x="20" y="20" width="180" height="200" rx="16" fill="rgba(17, 24, 39, 0.7)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5" />
    
    <!-- Scanning Laser Line -->
    <line x1="20" y1="110" x2="200" y2="110" stroke="#38BDF8" stroke-width="2" opacity="0.8" />
    
    <g fill="none" stroke="#A855F7" stroke-width="1.5">
      <circle cx="110" cy="90" r="32" />
      <path d="M 65 170 C 65 140, 85 130, 110 130 C 135 130, 155 140, 155 170 Z" />
    </g>

    <!-- Scan Verification Badge -->
    <g transform="translate(45, 180)">
      <rect width="130" height="28" rx="14" fill="#070B14" stroke="#10B981" stroke-width="1.5" />
      <circle cx="20" cy="14" r="5" fill="#10B981" />
      <text x="70" y="19" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">VERIFIED 100%</text>
    </g>
  </g>

  <!-- Live Attendance Logs Table -->
  <g transform="translate(290, 40)">
    <rect width="270" height="200" rx="12" fill="#0D1220" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1" />
    <text x="16" y="28" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">ATTENDANCE LOGS (DJANGO API)</text>

    <!-- Row 1 -->
    <rect x="12" y="44" width="246" height="34" rx="6" fill="#111827" />
    <circle cx="26" cy="61" r="5" fill="#10B981" />
    <text x="40" y="65" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Student ID: #CSE-402</text>
    <text x="210" y="65" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">09:02 AM</text>

    <!-- Row 2 -->
    <rect x="12" y="86" width="246" height="34" rx="6" fill="#111827" />
    <circle cx="26" cy="103" r="5" fill="#10B981" />
    <text x="40" y="107" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Student ID: #CSE-418</text>
    <text x="210" y="107" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">09:03 AM</text>

    <!-- Row 3 -->
    <rect x="12" y="128" width="246" height="34" rx="6" fill="#111827" />
    <circle cx="26" cy="145" r="5" fill="#10B981" />
    <text x="40" y="149" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Student ID: #CSE-425</text>
    <text x="210" y="149" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">09:05 AM</text>

    <text x="16" y="186" fill="#A855F7" font-family="'JetBrains Mono', monospace" font-size="9">&gt; DATABASE: POSTGRESQL &bull; STATUS: SYNCED</text>
  </g>

  <!-- Title Pill -->
  <g transform="translate(30, 290)">
    <rect width="270" height="38" rx="19" fill="#070B14" stroke="url(#purpleGrad)" stroke-width="1.5" />
    <text x="135" y="24" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      Smart Attendance &bull; Facial Rec &bull; Django
    </text>
  </g>
</svg>
