<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="meshGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />
  <rect width="400" height="400" rx="32" fill="url(#grid)" />
  <circle cx="200" cy="180" r="140" fill="url(#meshGrad)" filter="blur(20px)" />
  <circle cx="280" cy="120" r="90" fill="#6366f1" fill-opacity="0.15" filter="blur(30px)" />

  <!-- Outer Ring -->
  <circle cx="200" cy="170" r="110" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />
  <circle cx="200" cy="170" r="120" fill="none" stroke="#475569" stroke-width="1" opacity="0.4" />

  <!-- Silhouette -->
  <g fill="#94a3b8">
    <circle cx="200" cy="140" r="46" fill="#cbd5e1" />
    <rect x="174" y="132" width="52" height="12" rx="4" fill="url(#accentGrad)" />
    <path d="M 115 260 C 115 205, 150 195, 200 195 C 250 195, 285 205, 285 260 Z" fill="#475569" opacity="0.9" />
    <path d="M 140 260 C 140 215, 165 205, 200 205 C 235 205, 260 215, 260 260 Z" fill="#334155" />
  </g>

  <!-- Badges -->
  <g transform="translate(60, 90)">
    <rect width="44" height="24" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <text x="22" y="16" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">&lt;DS/&gt;</text>
  </g>
  <g transform="translate(290, 80)">
    <rect width="48" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="24" y="16" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">AI•ML</text>
  </g>
  <g transform="translate(290, 240)">
    <rect width="42" height="24" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="21" y="16" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">0110</text>
  </g>

  <!-- Label Badge -->
  <g transform="translate(100, 310)">
    <rect width="200" height="42" rx="21" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="1.5" />
    <text x="100" y="26" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      [Your Photo / Avatar]
    </text>
  </g>
</svg>
